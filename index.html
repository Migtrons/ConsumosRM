<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoreo de Caudal - ConsumosRM</title>
    
    <!-- Librería del Mapa (Leaflet) -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>

    <style>
        /* Estilos globales y reset */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; width: 100%; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #e8f4fd; display: flex; flex-direction: column; }
        
        #menu { 
            background: #2c3e50; 
            padding: 15px; 
            display: flex; 
            gap: 10px; 
            align-items: center; 
            color: white; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.3); 
            z-index: 1000; 
            height: 60px; 
        }
        
        h3 { margin: 0; font-size: 16px; margin-right: 15px; }
        
        .btn { 
            background: #34495e; 
            color: white; 
            border: none; 
            padding: 10px 20px; 
            font-size: 14px; 
            cursor: pointer; 
            border-radius: 4px; 
            transition: 0.3s; 
            font-weight: bold; 
        }
        .btn:hover { background: #1abc9c; }
        .btn.active { background: #1abc9c; box-shadow: inset 0 0 5px rgba(0,0,0,0.5); }
        
        #map { width: 100%; height: calc(100vh - 60px); z-index: 1; }

        /* Estilos personalizados para las etiquetas fijas tipo Acueducto */
        .etiqueta-sector {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            color: #000000 !important;
            font-family: 'Segoe UI', Arial, sans-serif !important;
            font-weight: bold !important;
            font-size: 13px !important;
            text-align: center !important;
            text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff; /* Borde blanco sutil al texto para legibilidad */
        }
    </style>
</head>
<body>

    <!-- Menú de navegación por años -->
    <div id="menu">
        <h3>Seleccione el Año de Monitoreo:</h3>
        <button class="btn active" onclick="cambiarAnio('2023', this)">2023</button>
        <button class="btn" onclick="cambiarAnio('2025', this)">2025</button>
        <button class="btn" onclick="cambiarAnio('2026', this)">2026 (Actual)</button>
    </div>

    <!-- Contenedor del mapa -->
    <div id="map"></div>

    <script>
        // 1. Inicializar el mapa centrado en Bogotá
        const map = L.map('map').setView([4.62, -74.12], 12);

        // Capa base urbana clara
        L.tileLayer('https://{s}://{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO'
        }).addTo(map);

        // Mapeo de archivos geojson por año
        const rutasMapas = {
            '2023': 'datos/QSUM2023.geojson',     
            '2025': 'datos/Abastecimiento.geojson', 
            '2026': 'datos/Abastecimiento.geojson'  
        };

        let anioActual = '2023';
        let capaSectores;
        let capaPuntos;

        // 2. Función para cargar capas con el estilo solicitado
        function cargarCapas() {
            if (capaSectores) { map.removeLayer(capaSectores); }
            if (capaPuntos) { map.removeLayer(capaPuntos); }

            // Cargar polígonos de sectores
            fetch(rutasMapas[anioActual])
                .then(response => response.json())
                .then(data => {
                    capaSectores = L.geoJSON(data, {
                        style: function(feature) {
                            return {
                                fillOpacity: 0,      // Sin relleno (100% transparente)
                                weight: 2.5,         // Borde negro grueso
                                color: '#000000',    // Líneas divisorias negras
                                dashArray: ''        // Línea continua
                            };
                        },
                        onEachFeature: function(feature, layer) {
                            // Extracción de datos desde los atributos de tu QGIS
                            const numSector = feature.properties['NUM SECTOR'] || feature.properties['NUM_SECTOR'] || feature.properties.id || "00";
                            
                            // Busca el caudal dinámico del campo específico de 2023 o campos genéricos
                            const valorCaudal = feature.properties['MAX_F2023Q'] || feature.properties.caudal || feature.properties.Q_SUM || "0.00";
                            
                            // Asegurar formato "S-XX" (Agrega el S- si el campo no lo trae originalmente)
                            const etiquetaFormateada = numSector.toString().startsWith('S-') ? numSector : `S-${numSector}`;

                            // Crear etiqueta de texto fija y centrada en medio del sector
                            layer.bindTooltip(`
                                <div>${etiquetaFormateada}</div>
                                <div>${valorCaudal} m3/s</div>
                            `, {
                                permanent: true,        // Hace que la etiqueta se quede fija en pantalla
                                direction: 'center',    // Centra el texto en el medio del polígono
                                className: 'etiqueta-sector' // Aplica estilos CSS transparentes
                            });
                        }
                    }).addTo(map);

                    // Auto-encuadre geográfico a la zona de estudio
                    map.fitBounds(capaSectores.getBounds());
                })
                .catch(err => console.error("Error cargando polígonos:", err));

            // Cargar puntos de control (ptos.geojson)
            fetch('datos/ptos.geojson')
                .then(response => response.json())
                .then(data => {
                    capaPuntos = L.geoJSON(data, {
                        pointToLayer: function(feature, latlng) {
                            return L.circleMarker(latlng, {
                                radius: 4,
                                fillColor: "#e74c3c",
                                color: "#ffffff",
                                weight: 1,
                                opacity: 1,
                                fillOpacity: 0.9
                            });
                        }
                    }).addTo(map);
                })
                .catch(err => console.error("Error cargando puntos:", err));
        }

        // 3. Controlador de interacción de los botones
        function cambiarAnio(anio, boton) {
            anioActual = anio;
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            boton.classList.add('active');
            cargarCapas(); 
        }

        // Carga inicial al ingresar
        cargarCapas();
    </script>
</body>
</html>
